services:
  db:
    image: postgres:16-alpine
    container_name: raizes-db
    environment:
      POSTGRES_USER: raizes
      POSTGRES_PASSWORD: raizes
      POSTGRES_DB: raizes_nordeste
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # os .sql dessa pasta rodam sozinhos na primeira vez que o banco é criado
      - ./database:/docker-entrypoint-initdb.d

volumes:
  pgdata:
